version: '3.8'

networks:
  sre-net:
    driver: bridge

volumes:
  redis-data:

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - sre-net

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - sre-net
    volumes:
      - redis-data:/data

  sre-app:
    image: ${DOCKER_USER}/sre-app:latest
    restart: always
    deploy:
      replicas: 3
    environment:
      - REDIS_ADDR=redis:6379 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sre-app.rule=PathPrefix(`/`)"
      - "traefik.http.services.sre-app.loadbalancer.server.port=3000"
    networks:
      - sre-net
    depends_on:
      - redis